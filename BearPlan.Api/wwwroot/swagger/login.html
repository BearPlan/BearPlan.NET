<html lang="zh-CN">

<head>
  <title>登录-BearPlan接口文档</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="/swagger/login.css">
</head>

<body>
  <div class="login-page">
    <!-- 点阵背景（鼠标跟随聚光灯） -->
    <div class="dot-bg"></div>
    <div class="dot-bright"></div>

    <!-- 登录卡片 -->

      <header class="login-header">
        <span class="logo">
          <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
            <path fill="currentColor"
              d="M512.896 562.912c63.456 0 104.576-67.968 104.608-101.984 0-21.856-69.632-36.128-111.872-36.416-30.688-0.224-106.912 14.656-98.464 50.048 9.472 39.808 52.512 88.352 105.728 88.352z m-2.048 408.96c-195.552 0-455.552-37.888-455.552-365.472 0-105.536 22.272-210.72 63.232-301.088a130.176 130.176 0 0 1-84.032-121.536 130.08 130.08 0 0 1 129.92-129.92h0.192a129.28 129.28 0 0 1 104.864 53.504l0.256 0.384a391.488 391.488 0 0 1 241.12-81.6c89.248 0 172.224 28.448 242.496 82.72a128.992 128.992 0 0 1 106.24-54.976 130.08 130.08 0 0 1 129.92 129.92 130.112 130.112 0 0 1-86.016 122.272c40.8 90.144 62.944 195.104 62.944 300.352-0.064 327.584-260.032 365.472-455.584 365.472zM224.288 245.408L196.48 296.352c-48.608 89.024-75.36 199.136-75.36 310.016 0 210.08 116.544 299.68 389.728 299.68s389.728-89.632 389.728-299.68c0-110.976-26.816-221.088-75.424-310.144l-28.032-51.328 61.248 2.848c36.608 0 65.28-28.704 65.28-64.032s-28.768-64.096-64.096-64.096a63.68 63.68 0 0 0-62.464 49.888l-12.8 56.704-42.016-40.192c-65.312-62.464-143.168-94.144-231.456-94.144-87.52 0-164.832 31.104-229.76 92.448L240.064 223.136 226.56 168.352a64 64 0 0 0-62.048-48.704h-0.096c-35.328 0-64.096 28.768-64.096 64.096s28.768 64.096 64.096 64.096l1.856-0.16 57.984-2.304zM512 924.832c-197.952 0-301.536-164.096-301.536-326.176 0-51.232 21.728-218.368 301.536-218.368s301.504 167.136 301.504 218.368c0 162.048-103.552 326.176-301.504 326.176z m0-522.624c-65.6 0-279.616 14.144-279.616 196.416 0 151.2 96.032 304.256 279.616 304.256s279.584-153.056 279.584-304.256c0-182.24-213.984-196.416-279.584-196.416z m197.984-111.424a42.24 42.24 0 0 1-84.48 0 42.24 42.24 0 0 1 84.48 0z m-208.96 267.392h21.92v251.296h-21.92v-251.296z m42.464 259.84c-105.76 0-190.368-72.64-223.776-197.952l42.368-11.296c33.536 125.76 123.008 186.656 233.44 158.624l10.752 42.56a257.984 257.984 0 0 1-62.752 8.064zM327.936 265.248h129.504v43.84h-129.504v-43.84z" />
          </svg>
          </span>
          <h1 class="title">BearPlan 文档</h1>
      </header>

      <div class="login-body">
        <h2 class="subtitle">账号登录</h2>

        <div class="input-wrap">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <input id="userName" name="userName" placeholder="请输入用户名" type="text">
        </div>

        <div class="input-wrap pwd-wrap">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input id="password" name="password" placeholder="请输入密码" type="password">
          <button class="pwd-toggle" type="button" onclick="togglePwd(this);" aria-label="显示/隐藏密码">
            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
              <path
                d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
              <path
                d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
              <line x1="2" x2="22" y1="2" y2="22" />
            </svg>
          </button>
        </div>

        <button class="login-btn" type="button" onclick="login();">登 录</button>
      </div>
    </div>
  </div>

  <div id="overlay" class="overlay">
    <div class="loader"></div>
  </div>
</body>

<script src="/js/jquery-3.7.1.min.js" type="text/javascript"></script>
<script src="/js/jsencrypt.min.js" type="text/javascript"></script>
<!--<script src="https://cdn.jsdelivr.net/npm/jsencrypt@3.0.0-rc.1/bin/jsencrypt.min.js"></script>-->
<script type="text/javascript">
  function showOverlay() {
    // 显示遮罩层
    document.getElementById('overlay').style.display = 'flex';
  }

  function hideOverlay() {
    // 隐藏遮罩层
    document.getElementById('overlay').style.display = 'none';
  }

  function togglePwd() {
    // 切换密码可见性
    var wrap = document.querySelector('.pwd-wrap');
    var input = document.getElementById('password');
    var isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    wrap.classList.toggle('show-pwd', isText);
  }

  // 点阵鼠标聚光灯：把鼠标/触摸坐标写进 .login-page 的 CSS 变量，点亮鼠标周围的点
  (function initDotSpotlight() {
    var page = document.querySelector('.login-page');
    if (!page) return;
    function setPos(x, y) {
      var rect = page.getBoundingClientRect();
      page.style.setProperty('--mx', (x - rect.left) + 'px');
      page.style.setProperty('--my', (y - rect.top) + 'px');
    }
    document.addEventListener('mousemove', function (e) { setPos(e.clientX, e.clientY); });
    document.addEventListener('touchmove', function (e) {
      var t = e.touches[0];
      if (t) setPos(t.clientX, t.clientY);
    }, { passive: true });
    document.addEventListener('mouseleave', function () {
      page.style.setProperty('--mx', '50%');
      page.style.setProperty('--my', '50%');
    });
  })();

  function getQueryString(name) {
    var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
    var r = window.location.search.substr(1).match(reg);
    if (r != null) return decodeURI(r[2]);
    return null;
  }

  function login() {
    showOverlay();
    var userName = $("#userName").val()
    var password = $("#password").val()
    if (!userName) {
      alert('请输入用户名！');
      hideOverlay();
      return
    }
    if (!password) {
      alert('请输入密码');
      hideOverlay();
      return
    }

    var encrypt = new JSEncrypt();
    var publicKey = `-----BEGIN PUBLIC KEY-----
                     MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCAYjJNTDWSTJ8RBnZ9hp7AS8eF\n
                     JvxpuZYTqGjD8qak45DKkAhpi7SNXDNbfDXNbUFeH465hwQIznS5fHdWgUAoqByG\n
                     jHoYu1jRhDx72EgKhuvDQ3sxwLJr0Ynx1f1Ny9yt8wtLaVc9KcJ8m/pHmmAGz+xf\n                     7rzZ8dJvnee+OHMkNwIDAQAB
                     -----END PUBLIC KEY-----`;
    encrypt.setPublicKey(publicKey);

    let postData = {
      "userName": userName,
      "password": encrypt.encrypt(password),
    };

    $.ajax({
      url: "/api/auth/swaggerlogin",
      type: "POST",
      contentType: "application/json; charset=utf-8",
      data: JSON.stringify(postData),
      dataType: 'json',
      success: function () {
        let redirect = getQueryString("redirect");
        if (redirect != null && redirect.length > 0) {
          window.location.href = redirect;
        } else {
          window.location.href = "/swagger/index.html";
        }
      }, error: function () {
        alert('用户名或密码错误')
        hideOverlay();
      }
    });
  }
</script>
</html>
